[project]
name = "PKU-Digger-Club-Bot"
version = "0.1.0"
description = "A small, self-hosted daily song duel for PKU Digger Club"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "Pillow>=11,<13",
    "python-dotenv>=1,<2",
    "gunicorn>=23,<24",
    "itsdangerous>=2.2,<3",
]

[dependency-groups]
dev = [
    "djlint>=1.36,<2",
    "pytest>=8,<10",
    "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.djlint]
profile = "jinja"
indent = 2
max_line_length = 100
preserve_blank_lines = true
