services:
  app:
    mem_reservation: 96m
    build: ..
    image: pku-digger-club-bot:local
    env_file: ../.env.local
    environment:
      DATABASE: /app/data/cricket.sqlite3
      OUTPUT_DIR: /app/output
      DEMO_MODE: "0"
    volumes:
      - ../data:/app/data
      - ../output:/app/output
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  worker:
    mem_reservation: 64m
    build: ..
    image: pku-digger-club-bot:local
    env_file: ../.env.local
    environment:
      DATABASE: /app/data/cricket.sqlite3
      OUTPUT_DIR: /app/output
      DEMO_MODE: "0"
    volumes:
      - ../data:/app/data
      - ../output:/app/output
    command: ["python", "-m", "cricket", "worker"]
    restart: unless-stopped
    profiles: ["schedule"]
  caddy:
    mem_reservation: 32m
    image: caddy:2-alpine
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["https"]

volumes:
  caddy_data:
  caddy_config:
