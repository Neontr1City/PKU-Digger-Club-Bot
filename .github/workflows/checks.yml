name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python and locked dependencies
        run: uv sync --locked --python 3.12
      - name: Install font for result images
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Check Python and templates
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run djlint cricket/templates --check
      - name: Test
        run: uv run pytest -q
